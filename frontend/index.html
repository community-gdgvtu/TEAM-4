<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1729">
    <meta name="description" content="SkillPassport turns academic records and real project work into inspectable skill claims you can challenge and prove.">
    <meta property="og:title" content="SkillPassport — skills you can inspect, proof you can challenge">
    <meta property="og:description" content="A resume is a claim. SkillPassport shows the evidence — and lets you challenge it.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="__OG_IMAGE__">
    <meta property="og:image:width" content="1731">
    <meta property="og:image:height" content="909">
    <meta property="og:image:alt" content="SkillPassport proof graph and verified skill stamp preview">
    <meta name="twitter:card" content="summary_large_image">
    <title>SkillPassport — Inspect the evidence. Challenge the proof.</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <a class="skip-link" href="#mainContent">Skip to content</a>

    <div class="app-frame">
        <header class="site-header" id="siteHeader"></header>
        <main id="mainContent" tabindex="-1"></main>
        <footer class="site-footer" id="siteFooter"></footer>
    </div>

    <div class="toast-region" id="toastRegion" role="status" aria-live="polite" aria-atomic="true"></div>

    <dialog class="evidence-dialog" id="evidenceDialog" aria-labelledby="evidenceDialogTitle">
        <div class="dialog-header">
            <div>
                <p class="eyebrow">Evidence provenance</p>
                <h2 id="evidenceDialogTitle">Evidence detail</h2>
            </div>
            <button class="icon-button" type="button" data-action="close-evidence" aria-label="Close evidence detail">
                <span aria-hidden="true">×</span>
            </button>
        </div>
        <div id="evidenceDialogBody"></div>
    </dialog>

    <div class="route-progress" id="routeProgress" aria-hidden="true"></div>
    <script src="/runtime-config.js"></script>
    <script src="/app.js" defer></script>
</body>
</html>
